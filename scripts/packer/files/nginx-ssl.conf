add_header X-Content-Type-Options "nosniff";
add_header X-XSS-Protection "1; mode=block";
add_header X-Frame-Options "SAMEORIGIN";
add_header Strict-Transport-Security "max-age=631138519";
add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://ajax.googleapis.com; style-src 'self' https://fonts.googleapis.com;";

server {
   listen      0.0.0.0:APP_NGINX_PORT ssl;

   ssl_certificate /etc/ssl/certs/secmonkey.crt;
   ssl_certificate_key /etc/ssl/private/secmonkey.key;

   access_log  APP_LOG_DIR/security_monkey.access.log;
   error_log   APP_LOG_DIR/security_monkey.error.log;

   location ~* ^/(reset|confirm|healthcheck|register|login|logout|api) {
        proxy_read_timeout 120;
        proxy_pass  http://127.0.0.1:APP_API_PORT;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static {
        rewrite ^/static/(.*)$ /$1 break;
        root APP_INSTALL_BASE_DIR/security_monkey/security_monkey/static;
        index ui.html;
    }

    location / {
        root APP_INSTALL_BASE_DIR/security_monkey/security_monkey/static;
        index ui.html;
    }
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}
