# Copy this file to:
#    /etc/supervisor/conf.d/security_monkey.conf
# Restart system supervisor
#   sudo service supervisor restart
# Control Startup/Shutdown:
#   sudo supervisorctl

[program:securitymonkey]
user=www-data

environment=PYTHONPATH='APP_INSTALL_BASE_DIR/security_monkey',SECURITY_MONKEY_SETTINGS=APP_INSTALL_BASE_DIR/security_monkey/env-config/config-deploy.py"
autostart=true
autorestart=true
command=python APP_INSTALL_BASE_DIR/security_monkey/manage.py run_api_server

[program:securitymonkeyscheduler]
user=www-data
autostart=true
autorestart=true
directory=APP_INSTALL_BASE_DIR/security_monkey/
environment=PYTHONPATH='APP_INSTALL_BASE_DIR/security_monkey/',SECURITY_MONKEY_SETTINGS="APP_INSTALL_BASE_DIR/security_monkey/env-config/config-deploy.py"
command=python APP_INSTALL_BASE_DIR/security_monkey/manage.py start_scheduler
