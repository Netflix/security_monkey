---

version: '3.2'
services:
  postgres:
    container_name: secmonkey-db
    image: postgres:10.1

  init:
    container_name: init
    build: .
    image: secmonkey:latest
    working_dir: /opt/security_monkey
    volumes:
        - type: bind
          source: ./data/aws_accounts.json
          target: /opt/security_monkey/data/aws_accounts.json
        - type: bind
          source: ./docker
          target: /opt/security_monkey/docker
        - type: bind
          source: ./env-config/config-docker.py
          target: /opt/security_monkey/env-config/config-docker.py
    depends_on:
      - postgres
    env_file: secmonkey.env
    entrypoint: /opt/security_monkey/docker/api-init.sh
